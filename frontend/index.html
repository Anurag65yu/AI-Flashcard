<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Flashcard Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>AI Flashcard Generator</h1>
    <p class="subtitle">Enter a topic, or paste your notes. Click a card to flip it.</p>

    <form id="form">
      <label for="input" class="sr-only">Topic or notes</label>
      <textarea id="input" placeholder="Enter a topic or paste text..." required></textarea>

      <div class="row">
        <label for="count">Cards</label>
        <input id="count" type="number" min="1" max="20" value="5">
        <button type="submit" id="submit">Generate Flashcards</button>
      </div>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <div id="flashcards"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
